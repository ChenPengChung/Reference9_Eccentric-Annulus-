# Eccentric Annulus Bipolar Grid -- Default Configuration
# ========================================================

# Geometry
R1 = 1.0            # Inner radius
R2 = 3.0            # Outer radius
ECCENTRICITY = 1.0  # Physical eccentricity (0 < e < R2-R1)

# Grid resolution
N_XI = 200           # Circumferential (xi) grid points
N_ETA = 80           # Radial (eta) grid points

# Stretching (Vinokur tanh)
STRETCH_XI = 0.0     # Circumferential (usually 0)
STRETCH_ETA = 1.0    # Radial GAMMA (recommended: 0~1.0 for eccentric annulus)
ALPHA_S = 0.5        # Symmetry (0.5 = symmetric)

# Output
OUTPUT_DIR = .
PREFIX = eccentric_annulus

# LBM stability estimation
UREF = 0.05
RE = 100
CFL = 0.5
