# Eccentric Annulus Bipolar Grid -- High Eccentricity Example
# ==============================================================
# WARNING: High eccentricity (eps > 0.7) requires careful GAMMA selection.
# The narrow gap region amplifies metric non-uniformity.
# GAMMA should be <= 0.5, preferably 0 (uniform).

# Geometry
R1 = 1.0
R2 = 3.0
ECCENTRICITY = 1.5  # eps = 1.5/2.0 = 0.75 (high!)

# Grid resolution (higher for narrow gap resolution)
N_XI = 300
N_ETA = 100

# Stretching -- CAUTION: use low GAMMA for high eccentricity
STRETCH_XI = 0.0
STRETCH_ETA = 0.3    # Very mild (eps=0.75 needs low GAMMA)
ALPHA_S = 0.5

# Output
OUTPUT_DIR = .
PREFIX = high_ecc

# LBM
UREF = 0.05
RE = 100
CFL = 0.5
